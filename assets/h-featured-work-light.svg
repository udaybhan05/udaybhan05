<svg width="1200" height="104" viewBox="0 0 1200 104" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.6"/>
      <stop offset="0.75" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rc"><rect x="0" y="90" width="1200" height="2" rx="1"/></clipPath>
  </defs>
  <rect x="2" y="14" width="6" height="62" rx="3" fill="#2563EB">
    <animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="30" y="30" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#2563EB">02 · PROJECTS</text>
  <text x="28" y="74" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" fill="#1F2328">Featured work
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" fill="freeze"/>
  </text>
  <rect x="0" y="90" width="1200" height="2" rx="1" fill="url(#rule)"/>
  <g clip-path="url(#rc)">
    <rect x="-260" y="90" width="240" height="2" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1480 0" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
